title: EventVOX handleiding
description: Handleidingen voor organisaties die met EventVOX werken
lang: nl
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Colours and fonts of EventVOX (the app and eventvox.nl/welkom/): _sass/color_schemes/eventvox.scss,
# _sass/custom/setup.scss (fonts) and _sass/custom/custom.scss
color_scheme: eventvox
logo: "/assets/images/logo.svg"
# Top right: back to the website and to the login of EventVOX
aux_links:
  "Naar de website":
    - "https://eventvox.nl/welkom/"
  "Inloggen":
    - "https://eventvox.nl/login"
aux_links_new_tab: false
search_enabled: true
search:
  heading_level: 3
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Terug naar boven"
footer_content: "EventVOX: handleiding voor organisaties."
callouts:
  tip:
    title: Tip
    color: green
  let_op:
    title: Let op
    color: yellow
  info:
    title: Goed om te weten
    color: blue

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
